<main class="page-main auth-page">
  <div class="auth-card">
    <div class="account-brand">
      <img src="/Error_Lens_Logo.png" alt="ErrorLens Logo" />
      <h1>Error_Lens</h1>
    </div>

    <h2>Create account</h2>

    <form (ngSubmit)="register()">
      <div class="form-row">
        <label>
          Email
          <input type="email" [(ngModel)]="email" name="email" required />
        </label>
      </div>

      <div class="form-row">
        <label>
          Password
          <input type="password" [(ngModel)]="password" name="password" required />
        </label>
      </div>

      <div class="form-row">
        <label>
          Confirm Password
          <input
            type="password"
            [(ngModel)]="confirm"
            name="confirm"
            required
          />
        </label>
      </div>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Creating...' : 'Register' }}
      </button>
    </form>

    <div *ngIf="message" class="message-wrap">
      <p class="message">{{ message }}</p>
    </div>

    <p class="muted">
      Already have an account? <a routerLink="/account/login">Sign in</a>
    </p>
  </div>
</main>
