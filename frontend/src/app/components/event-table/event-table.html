<div class="event-table-container">
  <div class="filters">
    <div class="filter-group">
      <label>
        Severity:
        <app-custom-select
          [(value)]="severityFilter"
          [options]="severityOptions"
          [placeholder]="'Severity'"
        ></app-custom-select>

      </label>
      <label>
        Environment:
        <app-custom-select
          [(value)]="environmentFilter"
          [options]="environmentOptions"
          [placeholder]="'Environment'"
        ></app-custom-select>
      </label>

    </div>
    <button type="button" class="apply-button" (click)="applyFilters()">Apply Filters</button>
  </div>

  <table class="event-table" *ngIf="!loading">
    <thead>
      <tr>
        <th>Application</th>
        <th>Message</th>
        <th>Severity</th>
        <th>Event Type</th>
        <th>Environment</th>
        <th>Timestamp</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let event of events">
        <td>{{ event.application }}</td>
        <td>{{ event.message }}</td>
        <td><span class="severity-badge" [ngClass]="getSeverityClass(event.severity)">{{ event.severity }}</span></td>
        <td><span class="event-type-badge" [ngClass]="getEventTypeClass(event.event_type)">{{ event.event_type }}</span></td>
        <td>{{ event.environment }}</td>
        <td>{{ event.created_at | date:'short' }}</td>
        <td>
          <button type="button" class="row-action-button" (click)="onDelete(event)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="loading">Loading events...</p>
  <p *ngIf="!loading && events.length === 0">No events found.</p>
</div>
